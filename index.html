<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель складського обліку</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#6366f1',
                        brandHover: '#4f46e5',
                        darkBg: '#0f172a',
                        cardBg: '#1e293b',
                        cardBorder: '#334155'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1e293b; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="border-b border-cardBorder bg-cardBg/50 backdrop-blur sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-boxes-stacked text-brand text-2xl"></i>
                <h1 class="text-xl font-bold tracking-wide">Складський Облік</h1>
            </div>
            <div class="flex items-center gap-4">
                <span id="usdRateBadge" class="text-xs bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-full font-mono text-slate-300">
                    Курс USD: -- ₴
                </span>
                <button onclick="window.loadData()" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg border border-slate-700 transition">
                    <i id="refreshIcon" class="fa-solid fa-rotate text-sm"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full flex flex-col gap-6">

        <!-- KPI Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-cardBg border border-cardBorder rounded-xl p-4 flex items-center justify-between">
                <div>
                    <p class="text-xs text-slate-400 font-medium uppercase tracking-wider">Загальна кількість</p>
                    <h3 id="kpiTotalQty" class="text-2xl font-bold text-white mt-1">0</h3>
                </div>
                <div class="p-3 bg-brand/10 text-brand rounded-lg">
                    <i class="fa-solid fa-cubes text-xl"></i>
                </div>
            </div>

            <div class="bg-cardBg border border-cardBorder rounded-xl p-4 flex items-center justify-between">
                <div>
                    <p class="text-xs text-slate-400 font-medium uppercase tracking-wider">Вартість складських залишків</p>
                    <h3 id="kpiTotalSumUah" class="text-2xl font-bold text-emerald-400 mt-1">0 ₴</h3>
                    <p id="kpiTotalSumUsd" class="text-xs font-mono text-slate-400 mt-0.5">$0</p>
                </div>
                <div class="p-3 bg-emerald-500/10 text-emerald-400 rounded-lg">
                    <i class="fa-solid fa-wallet text-xl"></i>
                </div>
            </div>

            <div class="bg-cardBg border border-cardBorder rounded-xl p-4 flex items-center justify-between">
                <div>
                    <p class="text-xs text-slate-400 font-medium uppercase tracking-wider">Закупівлі за період</p>
                    <h3 id="kpiPurchasesSum" class="text-2xl font-bold text-indigo-400 mt-1">0 ₴</h3>
                    <p id="kpiPurchasesQtyText" class="text-xs text-slate-400 mt-0.5">Закуплено 0 шт за період</p>
                </div>
                <div class="p-3 bg-indigo-500/10 text-indigo-400 rounded-lg">
                    <i class="fa-solid fa-truck-ramp-box text-xl"></i>
                </div>
            </div>
        </div>

        <!-- Controls Block -->
        <div class="bg-cardBg border border-cardBorder rounded-xl p-4 flex flex-col md:flex-row gap-4 justify-between items-stretch md:items-center">
            
            <!-- Search -->
            <div class="relative flex-1 max-w-md">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                <input type="text" id="searchInput" oninput="window.handleSearchInput()" placeholder="Пошук за назвою або ID..." 
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg pl-9 pr-8 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-brand">
                <button id="clearSearchBtn" onclick="window.clearSearch()" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>

            <!-- Filters -->
            <div class="flex flex-wrap items-center gap-2 overflow-x-auto pb-1 md:pb-0">
                <button id="btn-all" onclick="window.setFilter('all')" class="px-3.5 py-1.5 rounded-lg text-xs font-medium border border-transparent bg-brand text-white shadow-lg shadow-brand/20 whitespace-nowrap">Усі</button>
                <button id="btn-empty" onclick="window.setFilter('empty')" class="px-3.5 py-1.5 rounded-lg text-xs font-medium border border-transparent text-slate-400 hover:text-white whitespace-nowrap">Немає в наявності</button>
                <button id="btn-warning" onclick="window.setFilter('warning')" class="px-3.5 py-1.5 rounded-lg text-xs font-medium border border-transparent text-slate-400 hover:text-white whitespace-nowrap">Закінчуються (&lt;20)</button>
                <button id="btn-good" onclick="window.setFilter('good')" class="px-3.5 py-1.5 rounded-lg text-xs font-medium border border-transparent text-slate-400 hover:text-white whitespace-nowrap">В достатній кількості</button>
            </div>

            <!-- Period Selector -->
            <div class="flex items-center gap-2 border-t md:border-t-0 md:border-l border-slate-700 pt-3 md:pt-0 md:pl-4">
                <div class="flex items-center gap-1 bg-slate-900 p-1 rounded-lg border border-slate-700 text-xs">
                    <button id="period-1d" onclick="window.setPeriod('1d')" class="px-2.5 py-1 rounded text-slate-400 font-medium">1Д</button>
                    <button id="period-7d" onclick="window.setPeriod('7d')" class="px-2.5 py-1 rounded text-slate-400 font-medium">7Д</button>
                    <button id="period-30d" onclick="window.setPeriod('30d')" class="px-2.5 py-1 rounded text-slate-400 font-medium">30Д</button>
                    <button id="period-custom" onclick="window.setPeriod('custom')" class="px-2.5 py-1 rounded text-slate-400 font-medium">Період</button>
                </div>
            </div>
        </div>

        <!-- Custom Date Inputs -->
        <div id="customDateInputs" class="hidden flex-wrap items-center gap-3 bg-cardBg border border-cardBorder rounded-xl p-3 text-xs">
            <span class="text-slate-400">Виберіть діапазон:</span>
            <input type="date" id="startDate" onchange="window.renderProducts()" class="bg-slate-900 border border-slate-700 rounded px-2.5 py-1 text-slate-200">
            <span class="text-slate-500">—</span>
            <input type="date" id="endDate" onchange="window.renderProducts()" class="bg-slate-900 border border-slate-700 rounded px-2.5 py-1 text-slate-200">
        </div>

        <!-- Table / Products List -->
        <div class="bg-cardBg border border-cardBorder rounded-xl overflow-hidden flex-1 flex flex-col">
            <div class="grid grid-cols-12 p-3.5 bg-slate-800/60 border-b border-cardBorder text-xs font-semibold text-slate-400 uppercase tracking-wider">
                <div class="col-span-1">ID</div>
                <div class="col-span-3">Назва товару</div>
                <div class="col-span-2 text-center">Ціна за од.</div>
                <div class="col-span-1 text-center cursor-pointer select-none" onclick="window.toggleSort('qty')">
                    Залишок <i id="sortIconQty" class="fa-solid fa-sort text-slate-600 text-[10px]"></i>
                </div>
                <div class="col-span-1 text-center cursor-pointer select-none" onclick="window.toggleSort('shipments')">
                    Відправлено <i id="sortIconDyn" class="fa-solid fa-sort text-slate-600 text-[10px]"></i>
                </div>
                <div class="col-span-2 text-center cursor-pointer select-none" onclick="window.toggleSort('purchases')">
                    Закупівлі <i id="sortIconPurchases" class="fa-solid fa-sort text-slate-600 text-[10px]"></i>
                </div>
                <div class="col-span-2 text-right">Загальна сума</div>
            </div>

            <div id="productsContainer" class="divide-y divide-cardBorder/40 overflow-y-auto max-h-[600px] custom-scrollbar">
                <!-- Data inserted dynamically -->
            </div>
        </div>
    </main>

    <!-- Modal Form -->
    <div id="actionModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-cardBg border border-cardBorder rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
            <button onclick="window.closeModal()" class="absolute right-4 top-4 text-slate-400 hover:text-white">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <h2 id="modalTitle" class="text-lg font-bold text-white mb-1">Оформити операцію</h2>
            <p id="modalProductName" class="text-sm text-brand font-medium mb-4 truncate"></p>

            <form id="purchaseForm" onsubmit="window.submitPurchaseForm(event)" class="space-y-4">
                <input type="hidden" id="modalProductId">
                <input type="hidden" id="modalActionType">

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Кількість (шт)*</label>
                    <input type="number" id="modalQtyInput" required min="1" placeholder="Введіть кількість" 
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-brand">
                </div>

                <div id="priceFieldContainer">
                    <label class="block text-xs font-medium text-slate-400 mb-1">Ціна за одиницю (₴)</label>
                    <input type="number" step="0.01" id="modalPriceInput" placeholder="Опціонально" 
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-brand">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Примітка</label>
                    <textarea id="modalNoteInput" rows="2" placeholder="Додаткова інформація..." 
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-brand"></textarea>
                </div>

                <div class="flex items-center justify-end gap-3 pt-2">
                    <button type="button" onclick="window.closeModal()" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-white transition">Скасувати</button>
                    <button type="submit" id="btnSubmitModal" class="px-4 py-2 bg-brand hover:bg-brandHover text-white rounded-lg text-sm font-medium shadow-lg shadow-brand/20 transition flex items-center gap-2">
                        <span>Зберегти</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toastNotification" class="fixed bottom-6 right-6 bg-emerald-500 text-slate-950 font-semibold text-sm px-4 py-3 rounded-xl shadow-2xl flex items-center gap-2 transform translate-y-20 opacity-0 transition-all duration-300 z-50">
        <i class="fa-solid fa-circle-check text-lg"></i>
        <span id="toastMessage">Операцію успішно виконано!</span>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/ВАШ_SCRIPT_ID/exec"; // ВКАЖІТЬ ВАШ URL ТУТ

        let allProducts = [];
        let allShipments = [];
        let allPurchases = [];
        let liveUsdRate = 41.5;

        let currentFilter = 'all';
        let currentPeriod = '30d';
        let sortField = null;
        let sortOrder = 'default';

        document.addEventListener('DOMContentLoaded', () => {
            window.loadData();
            fetchUsdRate();
        });

        async function fetchUsdRate() {
            try {
                const res = await fetch('https://api.monobank.ua/bank/currency');
                if (res.ok) {
                    const data = await res.json();
                    const usdObj = data.find(c => c.currencyCodeA === 840 && c.currencyCodeB === 980);
                    if (usdObj && usdObj.rateSell) {
                        liveUsdRate = usdObj.rateSell;
                        document.getElementById('usdRateBadge').innerText = `Курс USD: ${liveUsdRate.toFixed(2)} ₴`;
                    }
                }
            } catch (e) {
                console.warn('Не вдалося отримати курс monobank:', e);
            }
        }

        window.loadData = async () => {
            const refreshIcon = document.getElementById('refreshIcon');
            if (refreshIcon) refreshIcon.classList.add('fa-spin');

            try {
                const res = await fetch(API_URL);
                const data = await res.json();

                allProducts = data.products || [];
                allShipments = data.shipments || [];
                allPurchases = data.purchases || [];

                updateKPIs();
                window.renderProducts();
            } catch (err) {
                console.error("Помилка завантаження даних:", err);
            } finally {
                if (refreshIcon) refreshIcon.classList.remove('fa-spin');
            }
        };

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text);
            showToast(`Скопійовано: "${text}"`);
        }

        function showToast(msg) {
            const toast = document.getElementById('toastNotification');
            document.getElementById('toastMessage').innerText = msg;

            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        function getDateThreshold() {
            const now = new Date();
            if (currentPeriod === '1d') {
                return new Date(now.getTime() - 24 * 60 * 60 * 1000);
            } else if (currentPeriod === '7d') {
                return new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
            } else if (currentPeriod === '30d') {
                return new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
            } else if (currentPeriod === 'custom') {
                const startVal = document.getElementById('startDate').value;
                return startVal ? new Date(startVal) : null;
            }
            return null;
        }

        function getEndDateThreshold() {
            if (currentPeriod === 'custom') {
                const endVal = document.getElementById('endDate').value;
                if (endVal) {
                    const d = new Date(endVal);
                    d.setHours(23, 59, 59, 999);
                    return d;
                }
            }
            return null;
        }

        function updateKPIs() {
            let totalQty = 0;
            let totalValUah = 0;

            allProducts.forEach(p => {
                const qty = Number(p.qty) || 0;
                const price = Number(p.price) || 0;
                totalQty += qty;
                totalValUah += qty * price;
            });

            document.getElementById('kpiTotalQty').innerText = totalQty.toLocaleString('uk-UA');
            document.getElementById('kpiTotalSumUah').innerText = `${Math.round(totalValUah).toLocaleString('uk-UA')} ₴`;

            const usdVal = liveUsdRate > 0 ? Math.round(totalValUah / liveUsdRate) : 0;
            document.getElementById('kpiTotalSumUsd').innerText = `$${usdVal.toLocaleString('en-US')}`;

            document.getElementById('usdRateBadge').innerText = `Курс USD: ${liveUsdRate.toFixed(2)} ₴`;
        }

        window.setPeriod = (period) => {
            currentPeriod = period;
            ['1d', '7d', '30d', 'custom'].forEach(p => {
                const btn = document.getElementById(`period-${p}`);
                if (p === period) {
                    btn.className = "period-btn period-btn-hover px-3.5 py-1.5 rounded-lg text-xs font-medium border border-transparent bg-brand text-white shadow-lg shadow-brand/20";
                } else {
                    btn.className = "period-btn period-btn-hover px-3.5 py-1.5 rounded-lg text-xs font-medium border border-transparent text-slate-400";
                }
            });

            const customInputs = document.getElementById('customDateInputs');
            if (period === 'custom') {
                customInputs.classList.remove('hidden');
                customInputs.classList.add('flex');
            } else {
                customInputs.classList.remove('flex');
                customInputs.classList.add('hidden');
            }

            window.renderProducts();
        };

        window.setFilter = (filter) => {
            currentFilter = filter;
            ['all', 'empty', 'warning', 'good'].forEach(f => {
                const btn = document.getElementById(`btn-${f}`);
                if (f === filter) {
                    btn.className = "filter-btn filter-btn-hover px-3.5 py-1.5 rounded-lg text-xs font-medium border border-transparent bg-brand text-white shadow-lg shadow-brand/20 whitespace-nowrap";
                } else {
                    btn.className = "filter-btn filter-btn-hover px-3.5 py-1.5 rounded-lg text-xs font-medium border border-transparent text-slate-400 whitespace-nowrap";
                }
            });

            window.renderProducts();
        };

        window.handleSearchInput = () => {
            const query = document.getElementById('searchInput').value.trim();
            const clearBtn = document.getElementById('clearSearchBtn');
            if (query.length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }
            window.renderProducts();
        };

        window.clearSearch = () => {
            document.getElementById('searchInput').value = '';
            document.getElementById('clearSearchBtn').classList.add('hidden');
            window.renderProducts();
        };

        window.toggleSort = (field) => {
            if (sortField === field) {
                if (sortOrder === 'desc') sortOrder = 'asc';
                else if (sortOrder === 'asc') sortOrder = 'default';
                else sortOrder = 'desc';
            } else {
                sortField = field;
                sortOrder = 'desc';
            }

            document.getElementById('sortIconQty').className = "fa-solid fa-sort text-slate-600 text-[10px]";
            document.getElementById('sortIconDyn').className = "fa-solid fa-sort text-slate-600 text-[10px]";
            document.getElementById('sortIconPurchases').className = "fa-solid fa-sort text-slate-600 text-[10px]";

            if (sortOrder !== 'default') {
                const iconClass = sortOrder === 'desc' ? "fa-solid fa-sort-down text-brand text-[10px]" : "fa-solid fa-sort-up text-brand text-[10px]";
                if (field === 'qty') document.getElementById('sortIconQty').className = iconClass;
                if (field === 'shipments') document.getElementById('sortIconDyn').className = iconClass;
                if (field === 'purchases') document.getElementById('sortIconPurchases').className = iconClass;
            }

            window.renderProducts();
        };

        window.renderProducts = () => {
            const container = document.getElementById('productsContainer');
            const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
            const minDate = getDateThreshold();
            const maxDate = getEndDateThreshold();

            let filtered = allProducts.filter(p => {
                const qty = Number(p.qty) || 0;

                if (currentFilter === 'empty' && qty !== 0) return false;
                if (currentFilter === 'warning' && (qty < 1 || qty > 19)) return false;
                if (currentFilter === 'good' && qty < 20) return false;

                if (searchQuery) {
                    const matchId = String(p.id || '').toLowerCase().includes(searchQuery);
                    const matchName = String(p.name || '').toLowerCase().includes(searchQuery);
                    if (!matchId && !matchName) return false;
                }

                return true;
            });

            let periodPurchasesSum = 0;
            let periodPurchasesQty = 0;

            const computedProducts = filtered.map(p => {
                const pId = String(p.id);

                let shipmentsQty = 0;
                allShipments.forEach(s => {
                    if (String(s.productId) === pId) {
                        const sDate = new Date(s.date);
                        if ((!minDate || sDate >= minDate) && (!maxDate || sDate <= maxDate)) {
                            shipmentsQty += (Number(s.qty) || 0);
                        }
                    }
                });

                let purchasesQty = 0;
                let purchasesSum = 0;
                allPurchases.forEach(pur => {
                    if (String(pur.productId) === pId) {
                        const purDate = new Date(pur.date);
                        if ((!minDate || purDate >= minDate) && (!maxDate || purDate <= maxDate)) {
                            const q = Number(pur.qty) || 0;
                            const price = Number(pur.price) || Number(p.price) || 0;
                            purchasesQty += q;
                            purchasesSum += q * price;
                        }
                    }
                });

                periodPurchasesSum += purchasesSum;
                periodPurchasesQty += purchasesQty;

                return {
                    ...p,
                    periodShipments: shipmentsQty,
                    periodPurchasesQty: purchasesQty,
                    periodPurchasesSum: purchasesSum
                };
            });

            document.getElementById('kpiPurchasesSum').innerText = `${Math.round(periodPurchasesSum).toLocaleString('uk-UA')} ₴`;
            document.getElementById('kpiPurchasesQtyText').innerText = `Закуплено ${periodPurchasesQty} шт за період`;

            if (sortField && sortOrder !== 'default') {
                computedProducts.sort((a, b) => {
                    let valA = 0, valB = 0;
                    if (sortField === 'qty') {
                        valA = Number(a.qty) || 0;
                        valB = Number(b.qty) || 0;
                    } else if (sortField === 'shipments') {
                        valA = a.periodShipments;
                        valB = b.periodShipments;
                    } else if (sortField === 'purchases') {
                        valA = a.periodPurchasesSum;
                        valB = b.periodPurchasesSum;
                    }

                    return sortOrder === 'desc' ? valB - valA : valA - valB;
                });
            }

            if (computedProducts.length === 0) {
                container.innerHTML = `
                    <div class="p-8 text-center text-slate-500">
                        <i class="fa-solid fa-box-open text-3xl mb-2 text-slate-600"></i>
                        <p>Товарів не знайдено за заданими критеріями</p>
                    </div>`;
                return;
            }

            container.innerHTML = computedProducts.map(p => {
                const qty = Number(p.qty) || 0;
                const price = Number(p.price) || 0;
                const totalValue = qty * price;

                let badgeClass = "bg-emerald-500/10 text-emerald-400 border-emerald-500/20";
                if (qty === 0) badgeClass = "bg-red-500/10 text-red-400 border-red-500/20";
                else if (qty < 20) badgeClass = "bg-amber-500/10 text-amber-400 border-amber-500/20";

                return `
                    <div class="grid grid-cols-12 p-4 items-center hover:bg-slate-800/40 transition border-b border-cardBorder/40 text-sm">
                        <div class="col-span-1 font-mono text-xs text-slate-400 flex items-center gap-1.5">
                            <span onclick="copyToClipboard('${p.id}')" class="cursor-pointer hover:text-brand transition" title="Натисніть щоб скопіювати">${p.id}</span>
                        </div>
                        <div class="col-span-3 font-semibold text-white pr-2 flex items-center gap-2">
                            <span onclick="copyToClipboard('${p.name}')" class="cursor-pointer hover:text-brand transition" title="${p.name}">${p.name}</span>
                        </div>
                        <div class="col-span-2 text-center text-slate-300 font-mono">
                            ${price > 0 ? price.toFixed(2) + ' ₴' : '—'}
                        </div>
                        <div class="col-span-1 text-center">
                            <span class="inline-flex items-center justify-center px-2.5 py-1 rounded-lg text-xs font-bold border ${badgeClass}">
                                ${qty} шт
                            </span>
                        </div>
                        <div class="col-span-1 text-center font-mono font-medium ${p.periodShipments > 0 ? 'text-brand' : 'text-slate-500'}">
                            ${p.periodShipments > 0 ? '-' + p.periodShipments + ' шт' : '0'}
                        </div>
                        <div class="col-span-2 text-center font-mono">
                            <div class="text-xs text-emerald-400 font-semibold">+${p.periodPurchasesQty} шт</div>
                            <div class="text-[11px] text-slate-400">${Math.round(p.periodPurchasesSum).toLocaleString('uk-UA')} ₴</div>
                        </div>
                        <div class="col-span-2 text-right flex items-center justify-end gap-3">
                            <span class="font-mono font-bold text-slate-200">${Math.round(totalValue).toLocaleString('uk-UA')} ₴</span>
                            <div class="flex items-center gap-1">
                                <button onclick="openModal('${p.id}', '${encodeURIComponent(p.name)}', 'purchase')" title="Оформити закупівлю" class="p-1.5 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-lg transition text-xs">
                                    <i class="fa-solid fa-plus"></i>
                                </button>
                                <button onclick="openModal('${p.id}', '${encodeURIComponent(p.name)}', 'writeoff')" title="Списання / Відправка" class="p-1.5 bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 rounded-lg transition text-xs">
                                    <i class="fa-solid fa-minus"></i>
                                </button>
                            </div>
                        </div>
                    </div>`;
            }).join('');
        };

        window.openModal = (id, encodedName, actionType) => {
            const name = decodeURIComponent(encodedName);
            document.getElementById('modalProductId').value = id;
            document.getElementById('modalProductName').innerText = name;
            document.getElementById('modalActionType').value = actionType;
            document.getElementById('modalQtyInput').value = '';
            document.getElementById('modalPriceInput').value = '';
            document.getElementById('modalNoteInput').value = '';

            const modalTitle = document.getElementById('modalTitle');
            const priceContainer = document.getElementById('priceFieldContainer');

            if (actionType === 'purchase') {
                modalTitle.innerText = "Оформити закупівлю";
                priceContainer.classList.remove('hidden');
            } else {
                modalTitle.innerText = "Оформити списання / відправку";
                priceContainer.classList.add('hidden');
            }

            document.getElementById('actionModal').classList.remove('hidden');
        };

        window.closeModal = () => {
            document.getElementById('actionModal').classList.add('hidden');
        };

        window.submitPurchaseForm = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmitModal');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-xs"></i> <span>Збереження...</span>`;

            const id = document.getElementById('modalProductId').value;
            const actionType = document.getElementById('modalActionType').value;
            const qty = document.getElementById('modalQtyInput').value;
            const price = document.getElementById('modalPriceInput').value;
            const note = document.getElementById('modalNoteInput').value;

            try {
                const iframeName = 'hidden_post_iframe_' + Date.now();
                const iframe = document.createElement('iframe');
                iframe.name = iframeName;
                iframe.style.display = 'none';
                document.body.appendChild(iframe);

                const form = document.createElement('form');
                form.method = 'POST';
                form.action = API_URL;
                form.target = iframeName;

                const fields = { action: actionType, id, qty, price, note };
                for (const key in fields) {
                    const input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = key;
                    input.value = fields[key];
                    form.appendChild(input);
                }

                document.body.appendChild(form);
                form.submit();

                setTimeout(() => {
                    form.remove();
                    iframe.remove();
                    btn.disabled = false;
                    btn.innerHTML = `<span>Зберегти</span>`;
                    closeModal();
                    showToast(actionType === 'purchase' ? "Закупівлю успішно додано!" : "Списання успішно проведено!");
                    window.loadData();
                }, 1500);

            } catch (err) {
                console.error("Помилка збереження:", err);
                alert("Не вдалося зберегти дані.");
                btn.disabled = false;
                btn.innerHTML = `<span>Зберегти</span>`;
            }
        };
    </script>
</body>
</html>
